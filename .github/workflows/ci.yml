name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrack_test

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json, so CI and local match.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fintrack/database db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter @fintrack/web lint

      - name: Unit & API tests (in-memory store)
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm --filter @fintrack/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Migrations match schema.prisma (no drift)
        run: pnpm --filter @fintrack/database exec prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration

      - name: Build web app
        run: pnpm --filter @fintrack/web build
